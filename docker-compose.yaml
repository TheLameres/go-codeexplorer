services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U todo" ]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - 8080:8080
    environment:
      POSTGRESQL_URL: postgres://todo:todo@postgres:5432/todo
    depends_on:
      postgres:
        condition: service_healthy
